<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background-color: #030708;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas { display: block; outline: none; }
  </style>
  <script src="three.min.js"></script></head>
<body>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 18;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  document.body.appendChild(renderer.domElement);

  const particleCount = 280;
  const radius = 6.2;
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    const phi = Math.acos(-1 + (2 * i) / particleCount);
    const theta = Math.sqrt(particleCount * Math.PI) * phi;

    const x = radius * Math.cos(theta) * Math.sin(phi);
    const y = radius * Math.sin(theta) * Math.sin(phi);
    const z = radius * Math.cos(phi);

    positions[i * 3]     = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    velocities.push(new THREE.Vector3(
      (Math.random() - 0.5) * 0.015,
      (Math.random() - 0.5) * 0.015,
      (Math.random() - 0.5) * 0.015
    ));
  }

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0x00f0ff,
    size: 0.22,
    transparent: true,
    opacity: 0.85
  });
  const pointCloud = new THREE.Points(pGeo, pMat);
  scene.add(pointCloud);

  const lineMat = new THREE.LineBasicMaterial({
    color: 0x00a3cc,
    transparent: true,
    opacity: 0.22,
    blending: THREE.AdditiveBlending
  });
  const lineGeo = new THREE.BufferGeometry();
  const lineMesh = new THREE.LineSegments(lineGeo, lineMat);
  scene.add(lineMesh);

  // Outer orbital HUD ring
  const ringGeo = new THREE.RingGeometry(8.0, 8.04, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
  const hudRing = new THREE.Mesh(ringGeo, ringMat);
  hudRing.rotation.x = Math.PI / 3;
  scene.add(hudRing);

  // Inner pulsing energy core
  const coreGeo = new THREE.IcosahedronGeometry(2.4, 2);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0x0077aa,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  let clock = new THREE.Clock();
  let speedMultiplier = 1.0;

  // Reactivity hook: accelerates spin rate when speaking
  window.setSpeechActive = function(active) {
    speedMultiplier = active ? 2.5 : 1.0;
  };

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime() * speedMultiplier;
    const pos = pGeo.attributes.position.array;

    for (let i = 0; i < particleCount; i++) {
      pos[i * 3]     += velocities[i].x * speedMultiplier;
      pos[i * 3 + 1] += velocities[i].y * speedMultiplier;
      pos[i * 3 + 2] += velocities[i].z * speedMultiplier;

      const d = Math.sqrt(pos[i * 3] ** 2 + pos[i * 3 + 1] ** 2 + pos[i * 3 + 2] ** 2);
      if (d > radius * 1.15 || d < radius * 0.85) {
        velocities[i].negate();
      }
    }
    pGeo.attributes.position.needsUpdate = true;

    // Dynamic plexus connections
    const linePositions = [];
    const maxDistance = 2.4;
    for (let i = 0; i < particleCount; i++) {
      for (let j = i + 1; j < particleCount; j++) {
        const dx = pos[i * 3]     - pos[j * 3];
        const dy = pos[i * 3 + 1] - pos[j * 3 + 1];
        const dz = pos[i * 3 + 2] - pos[j * 3 + 2];
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < maxDistance) {
          linePositions.push(
            pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2],
            pos[j * 3], pos[j * 3 + 1], pos[j * 3 + 2]
          );
        }
      }
    }
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

    // Orbital Rotations
    pointCloud.rotation.y = elapsedTime * 0.08;
    lineMesh.rotation.y   = elapsedTime * 0.08;
    core.rotation.x       = -elapsedTime * 0.12;
    core.rotation.y       = elapsedTime * 0.15;
    hudRing.rotation.z    = elapsedTime * 0.05;

    // Pulsing core oscillation
    const scale = 1.0 + Math.sin(elapsedTime * 2.0) * 0.05;
    core.scale.set(scale, scale, scale);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
